<style>
:root{
  --bg:#08080f; --ink:#f4f4f7; --muted:#9c9cb0; --dim:#6e6e85;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --accent:#8b7cf6;
  --serif:'EB Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;
}
a{color:inherit;text-decoration:none;}

/* ---- nav (matches the rest of the site) ---- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:linear-gradient(180deg,rgba(8,8,15,.82),transparent);
}
.nav-in{
  max-width:1240px;margin:0 auto;padding:0 24px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{font-family:var(--serif);font-size:1.34rem;font-weight:500;letter-spacing:.13em;text-transform:uppercase;}
.nav-links{display:none;gap:30px;font-size:.9rem;}
.nav-links a{color:var(--muted);transition:color 160ms ease;}
@media(hover:hover) and (pointer:fine){ .nav-links a:hover{color:var(--ink);} }
.nav-links a.current{color:var(--ink);}
@media(min-width:820px){ .nav-links{display:flex;} }

/* ---- gallery canvas ---- */
#gal{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none;cursor:grab;}
#gal:active{cursor:grabbing;}

/* ---- title overlay ---- */
.overlay{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 24px;mix-blend-mode:exclusion;
}
.overlay h1{
  font-family:var(--serif);font-weight:500;line-height:1;
  font-size:clamp(2.8rem,10vw,6.6rem);letter-spacing:.01em;color:#fff;
}
.overlay h1 em{font-style:italic;}
.overlay p{
  font-family:var(--serif);font-style:italic;color:#fff;
  font-size:clamp(1rem,2.2vw,1.3rem);margin-top:12px;opacity:.85;
}

/* ---- bottom bar ---- */
.hud{
  position:fixed;left:0;right:0;bottom:26px;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 24px;
}
.hud-hint{
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);text-align:center;line-height:1.7;
}
.hud-cta{
  pointer-events:auto;display:inline-block;padding:12px 26px;border-radius:10px;
  font-size:.9rem;font-weight:500;color:var(--ink);
  background:rgba(255,255,255,.07);border:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:transform 160ms var(--ease-out),background 200ms ease,border-color 200ms ease;
}
.hud-cta:active{transform:scale(.97);}
@media(hover:hover) and (pointer:fine){
  .hud-cta:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3);}
}
.hud-cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

/* ---- static fallback: no WebGL / reduced motion ---- */
#fallback{
  position:fixed;inset:0;z-index:1;overflow-y:auto;display:none;
  padding:96px 20px 120px;
}
#fallback.on{display:block;}
.fb-grid{
  max-width:1240px;margin:0 auto;
  column-count:2;column-gap:12px;
}
@media(min-width:760px){ .fb-grid{column-count:3;} }
@media(min-width:1100px){ .fb-grid{column-count:4;} }
.fb-grid img{
  width:100%;display:block;margin-bottom:12px;border-radius:6px;
  break-inside:avoid;background:#13131f;
}
/* in fallback mode the overlay + HUD flow with the page instead of
   floating over a scrolling grid */
body.fb{overflow:auto;}
body.fb #fallback{position:static;inset:auto;padding:0 20px 40px;overflow:visible;}
body.fb .overlay{
  position:static;mix-blend-mode:normal;height:auto;
  padding:120px 24px 48px;
}
body.fb .overlay h1,body.fb .overlay p{color:var(--ink);}
body.fb .overlay p{color:var(--muted);opacity:1;}
body.fb .hud{position:static;margin:40px 0 60px;}
body.fb .nav{position:sticky;background:rgba(8,8,15,.9);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
</style>
</head>

(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function useFallback(){
    var grid = document.getElementById('fbGrid');
    if (!grid.childElementCount){
      GALLERY_IMAGES.forEach(function(im){
        var img = document.createElement('img');
        img.src = im.src; img.alt = im.alt; img.loading = 'lazy';
        grid.appendChild(img);
      });
    }
    var fb = document.getElementById('fallback');
    // reorder so the page reads nav -> title -> grid -> CTA
    var ov = document.querySelector('.overlay');
    if (ov && ov.parentNode) ov.parentNode.insertBefore(fb, ov.nextSibling);
    fb.classList.add('on');
    document.body.classList.add('fb');
    document.getElementById('gal').style.display = 'none';
    var h = document.getElementById('hint');
    if (h) h.style.display = 'none';
  }

  if (reduce){ useFallback(); return; }

  var g = InfiniteGallery({
    canvas: document.getElementById('gal'),
    images: GALLERY_IMAGES,
    speed: 1.2,
    fade:{inStart:.04,inEnd:.20,outStart:.52,outEnd:.60},
    blur:{inStart:0,inEnd:.10,outStart:.50,outEnd:.60,max:6},
